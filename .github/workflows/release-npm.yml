name: Release npm Packages

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify Release Version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release tag matches npm package version
        id: version
        shell: bash
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          RELEASE_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./crates/taffy-canvas-node/package.json').version")"

          if [[ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match crates/taffy-canvas-node/package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  publish-platform:
    name: Publish ${{ matrix.target.id }}
    needs: verify-version
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: darwin-arm64
            runner: macos-latest
          - id: darwin-x64
            runner: macos-13
          - id: linux-x64-gnu
            runner: ubuntu-latest
          - id: win32-x64-msvc
            runner: windows-latest

    defaults:
      run:
        working-directory: crates/taffy-canvas-node

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux system packages
        if: matrix.target.id == 'linux-x64-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libx11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: taffy-canvas-v1
          cache-on-failure: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Sync npm package versions
        run: npm run sync:versions

      - name: Run Node smoke test
        run: npm run test:smoke

      - name: Prepare platform package
        run: |
          npm run build
          npm run prepare:platform

      - name: Publish platform package
        run: npm publish ./npm/${{ matrix.target.id }} --provenance --access public

  publish-main:
    name: Publish taffy-canvas
    needs:
      - verify-version
      - publish-platform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: crates/taffy-canvas-node

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Sync npm package versions
        run: npm run sync:versions

      - name: Publish main npm package
        run: npm publish --provenance --access public
