[workspace]
members = [
  "crates/taffy-canvas-core",
  "crates/taffy-canvas-node",
]
resolver = "3"

[workspace.package]
authors = ["Dj"]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support", "plotters", "rayon"] }
indexmap = "2.12.0"
napi = { version = "3.8.4", default-features = false, features = ["async", "napi4", "tokio_rt"] }
napi-derive = "3.5.3"
once_cell = "1.21.3"
quick-xml = { version = "0.38.3", features = ["serialize"] }
rayon = "1.11.0"
regex = "1.12.2"
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
skia-safe = { version = "0.93.1", features = ["binary-cache", "textlayout", "webp"] }
smallvec = "1.15.1"
taffy = "0.10.0"
thiserror = "2.0.17"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros"] }
